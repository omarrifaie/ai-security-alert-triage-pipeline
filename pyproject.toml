[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-alert-triage-pipeline"
version = "0.1.0"
description = "DevSecOps pipeline that triages CodeQL alerts with an OpenAI-backed agent and tracks remediation in PostgreSQL."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Omar Rifaie" }]
keywords = ["devsecops", "codeql", "sarif", "openai", "triage", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# Upper bounds cap the next major so a future breaking release cannot silently
# break installs. Widen them deliberately after testing against a new major.
dependencies = [
    "typer>=0.12.0,<1.0",
    "rich>=13.7.0,<16.0",
    "openai>=1.40.0,<3.0",
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.3.0,<3.0",
    "sqlalchemy>=2.0.30,<3.0",
    "alembic>=1.13.0,<2.0",
    "psycopg[binary]>=3.2.0,<4.0",
    "fastapi>=0.111.0,<1.0",
    "jinja2>=3.1.4,<4.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "python-dotenv>=1.0.1,<2.0",
    "tenacity>=8.5.0,<10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
ai-triage = "ai_triage.cli:app"

[project.urls]
Homepage = "https://github.com/omarrifaie/ai-security-alert-triage-pipeline"
Issues = "https://github.com/omarrifaie/ai-security-alert-triage-pipeline/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_triage = ["dashboard/templates/*.html", "dashboard/static/*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "N802"]
"src/ai_triage/cli.py" = ["B008"]
"src/ai_triage/dashboard/app.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --tb=short"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/ai_triage"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
